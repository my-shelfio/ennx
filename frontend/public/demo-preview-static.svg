<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="demo-static-title">
  <title id="demo-static-title">ennx デモ（サンプルデータ）: 設定 → 選好入力 → 実行 → ステップ再生</title>
  <rect width="1200" height="630" fill="#F8FAFC"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- ブラウザ風の上部バー -->
  <rect x="0" y="0" width="1200" height="56" fill="#FFFFFF"/>
  <rect x="0" y="56" width="1200" height="1" fill="#E2E8F0"/>
  <circle cx="32" cy="28" r="7" fill="#E2E8F0"/>
  <circle cx="56" cy="28" r="7" fill="#E2E8F0"/>
  <circle cx="80" cy="28" r="7" fill="#E2E8F0"/>
  <rect x="110" y="16" width="260" height="24" rx="12" fill="#F1F5F9"/>
  <text x="130" y="33" font-family="Noto Sans CJK JP" font-size="14" fill="#64748B">ennx.onrender.com</text>

  <!-- 4 ステップ（設定→選好入力→実行→ステップ再生） -->
  <g font-family="Noto Sans CJK JP" font-weight="700" font-size="20">
    <!-- 1: 設定（完了） -->
    <circle cx="180" cy="160" r="28" fill="#3D46C9"/>
    <text x="180" y="168" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="180" y="212" fill="#334155" text-anchor="middle" font-size="18">設定</text>

    <rect x="228" y="152" width="120" height="6" rx="3" fill="#3D46C9"/>

    <!-- 2: 選好入力（完了） -->
    <circle cx="408" cy="160" r="28" fill="#3D46C9"/>
    <text x="408" y="168" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="408" y="212" fill="#334155" text-anchor="middle" font-size="18">選好入力</text>

    <rect x="456" y="152" width="120" height="6" rx="3" fill="#3D46C9"/>

    <!-- 3: 実行（アクティブ） -->
    <circle cx="636" cy="160" r="32" fill="#3D46C9"/>
    <text x="636" y="169" fill="#FFFFFF" text-anchor="middle" font-size="22">3</text>
    <text x="636" y="216" fill="#1E293B" text-anchor="middle" font-size="18" font-weight="700">実行</text>

    <rect x="688" y="152" width="120" height="6" rx="3" fill="#CBD5E1"/>

    <!-- 4: ステップ再生（未到達） -->
    <circle cx="864" cy="160" r="28" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <text x="864" y="168" fill="#94A3B8" text-anchor="middle">4</text>
    <text x="864" y="212" fill="#94A3B8" text-anchor="middle" font-size="18">ステップ再生</text>
  </g>

  <!-- 実行過程プレビュー（ステップ再生のイメージ） -->
  <rect x="140" y="280" width="920" height="270" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="172" y="322" font-family="Noto Sans CJK JP" font-size="18" font-weight="700" fill="#1E293B">実行過程（ステップ再生）</text>

  <g font-family="Noto Sans CJK JP" font-size="15" fill="#475569">
    <circle cx="188" cy="360" r="6" fill="#3D46C9"/>
    <text x="204" y="365">社員1が部署Aに仮申請しました。</text>
    <circle cx="188" cy="394" r="6" fill="#3D46C9"/>
    <text x="204" y="399">部署Aが社員1を仮受入しました。</text>
    <circle cx="188" cy="428" r="6" fill="#AEB7F8"/>
    <text x="204" y="433">社員2が部署Aに仮申請しました。</text>
    <circle cx="188" cy="462" r="6" fill="#AEB7F8"/>
    <text x="204" y="467">部署Aが社員2を仮受入し、社員1を保留しました。</text>
  </g>

  <rect x="172" y="500" width="856" height="10" rx="5" fill="#E2E8F0"/>
  <rect x="172" y="500" width="360" height="10" rx="5" fill="#3D46C9"/>

  <text x="600" y="600" font-family="Noto Sans CJK JP" font-size="16" fill="#94A3B8" text-anchor="middle">サンプルデータ（研修医マッチング風）で一連の流れを体験できます</text>
</svg>
