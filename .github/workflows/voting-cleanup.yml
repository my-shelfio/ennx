# 期限切れデータ（投票・共有された結果）の日次削除（遅延削除 + 日次 cron の保証側）。
# 本番 API の保護付きエンドポイントを叩く。Secrets:
#   VOTING_CLEANUP_URL: 例 https://<本番ドメイン>/api/v1/voting/cleanup
#   VOTING_CLEANUP_KEY: サーバー側 ENNX_CLEANUP_KEY と同じ値
# 共有された結果の削除エンドポイント（/api/v1/result-share/cleanup）の URL は
# VOTING_CLEANUP_URL から導出する（キーは同じ値を共用する）。
name: voting-cleanup

on:
  schedule:
    # 毎日 18:00 UTC（JST 03:00）。
    - cron: "0 18 * * *"
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Call cleanup endpoint
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.VOTING_CLEANUP_URL }}" ]; then
            echo "VOTING_CLEANUP_URL is not set; skipping." && exit 0
          fi
          curl --fail-with-body -sS -X POST \
            -H "X-Cleanup-Key: ${{ secrets.VOTING_CLEANUP_KEY }}" \
            "${{ secrets.VOTING_CLEANUP_URL }}"

      - name: Call result-share cleanup endpoint
        # 投票の削除が失敗しても、共有された結果の削除は実行する。
        if: ${{ !cancelled() }}
        env:
          VOTING_CLEANUP_URL: ${{ secrets.VOTING_CLEANUP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${VOTING_CLEANUP_URL}" ]; then
            echo "VOTING_CLEANUP_URL is not set; skipping." && exit 0
          fi
          case "${VOTING_CLEANUP_URL}" in
            */voting/cleanup) ;;
            *) echo "VOTING_CLEANUP_URL must end with /voting/cleanup." && exit 1 ;;
          esac
          url="${VOTING_CLEANUP_URL%/voting/cleanup}/result-share/cleanup"
          curl --fail-with-body -sS -X POST \
            -H "X-Cleanup-Key: ${{ secrets.VOTING_CLEANUP_KEY }}" \
            "${url}"
